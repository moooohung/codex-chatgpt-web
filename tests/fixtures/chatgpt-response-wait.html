<!-- Synthetic structure matching the two observed role=status notices. No real prompt or token. -->
<section id="turn" data-turn-key="synthetic-wait-turn">
  <div data-user-message-bubble><div data-search-result-target>Synthetic context.</div></div>
  <span hidden data-chatgpt-agent-turn-start></span>
  <div role="status" id="service-wait"><div><span class="loading-shimmer-pure-text"><div class="MarkdownRoot-fixture contents"><span>Our systems are thinking a bit more about this request before responding.</span></div></span></div></div>
  <div data-content-search-unit-key="answer"><h4 data-conversation-role="assistant"></h4><div data-markdown-text-style="assistant-message"><p>Partial answer.</p></div></div>
  <div class="turn-action-controls"><button>Copy</button></div>
  <div role="status" id="connection-wait"><span class="text-chatgpt-recovery">Connection interrupted. Waiting for the complete answer</span></div>
</section>
