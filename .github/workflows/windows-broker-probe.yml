# Port of upstream's 85eaf7bb Windows broker probe; use current offline tests
# instead of rewriting the broker source to inject traces.
name: Windows broker probe
on:
  push:
    branches: [main]
    paths:
      - 'src/adapters/chatgpt-web/*broker*'
      - 'src/adapters/chatgpt-web/*boundary*'
      - 'src/adapters/chatgpt-web/*helper*'
      - 'tests/*broker*'
      - 'tests/*boundary*'
      - '.github/workflows/windows-broker-probe.yml'
  pull_request:
    paths:
      - 'src/adapters/chatgpt-web/*broker*'
      - 'src/adapters/chatgpt-web/*boundary*'
      - 'src/adapters/chatgpt-web/*helper*'
      - 'tests/*broker*'
      - 'tests/*boundary*'
      - '.github/workflows/windows-broker-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify Windows broker lifecycle, ACK and outer harness
        run: bun test ./tests/turn-broker-lifecycle.test.ts ./tests/turn-orphan-watchdog.test.ts ./tests/tool-boundary-ipc.test.ts ./tests/dev-chat.test.ts
